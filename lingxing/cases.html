  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">

<body data-page="cases">
  <div id="site-header"></div>

  <section class="page-hero">

        </div>
      </div>
      <div class="logo-wall">
        <div class="logo-wall__item"><img src="assets/logos/continental.jpg" alt="Continental 德国马牌" loading="lazy"></div>

        <div class="logo-wall__item"><img src="assets/logos/tesla.jpg" alt="Tesla 特斯拉" loading="lazy"></div>
        <div class="logo-wall__item"><img src="assets/logos/nio.jpg" alt="NIO 蔚来" loading="lazy"></div>
        <div class="logo-wall__item"><img src="assets/logos/royalstar.jpg" alt="荣事达 Royalstar" loading="lazy"></div>
        <div class="logo-wall__item"><img src="assets/logos/fga.jpg" alt="FGA" loading="lazy"></div>
      </div>
    </div>
  </section>

  <section class="cta-band">
    <div class="wrap cta-band__inner">
      <div>
        <h2>你的行业可能已经有答案了</h2>
        <p>告诉我们产品与贴标场景，我们调出同类项目的做法给你参考。</p>
      </div>
      <a class="btn" href="contact.html">聊聊你的项目 <span class="arrow">→</span></a>
    </div>

  <div id="site-footer"></div>
