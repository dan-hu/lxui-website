# 芝诚官网 CI 流水线：Gitee → GitHub 同步 + 自动部署
#
# 数据流向：
#   本地代码 --push--> Gitee（主仓库，国内速度快）
#   GitHub Actions 每 10 分钟从 Gitee 镜像同步到本仓库
#   同步到新提交后自动执行部署
#
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 配置：
#   GITEE_TOKEN  : Gitee 私人令牌（权限：projects）
#   GITEE_REPO   : Gitee 仓库全名，如 shang0707/lxui-website
#   以及部署凭据（见下方 deploy 作业注释）

name: Sync Gitee & Deploy

on:
  schedule:
    - cron: "*/10 * * * *" # 每 10 分钟同步一次 Gitee
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: 记录同步前最新提交
        id: before
        run: echo "sha=$(git ls-remote https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: 从 Gitee 镜像同步到 GitHub
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          git config --global user.name "sync-bot"
          git config --global user.email "sync-bot@users.noreply.github.com"
          git clone --mirror "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" gitee.git
          cd gitee.git
          git push --mirror "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: 检查是否有新提交
        id: check
        run: |
          after=$(git ls-remote https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD | cut -f1)
          before="${{ steps.before.outputs.sha }}"
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到新提交：$before -> $after"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无更新，跳过部署"
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
